name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the comment is the release it was
# resolved from) and the runner is pinned; Dependabot proposes the bumps. Never
# replace a pin with a tag.
#
# `uv sync --locked`, never `--frozen`: --locked fails when uv.lock has drifted
# from pyproject.toml.

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # From requires-python's floor to the interpreter the image ships.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest

  image:
    name: image (build + smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t jamhooks-example-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 jamhooks-example-api:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/accounts/100001 | grep -q '"status":"active"'
      - name: Container logs
        if: always()
        run: docker logs api || true
