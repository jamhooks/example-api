name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the comment is the release it was
# resolved from) and the runner is pinned; Dependabot proposes the bumps. Never
# replace a pin with a tag.
#
# Deploying is not done here: Cloudflare Workers Builds pulls `master`, runs the
# tests itself and deploys (README, "Deployment"), so no Cloudflare credentials
# are stored in GitHub. This workflow tests and bundles every pull request and
# every push to `master`.

env:
  # No usage telemetry from CI.
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: test + bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      # Bundles the Worker exactly as a deploy would, without uploading it.
      - run: npm run check
