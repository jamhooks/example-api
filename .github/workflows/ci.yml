name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the comment is the release it was
# resolved from) and the runner is pinned; Dependabot proposes the bumps. Never
# replace a pin with a tag. Wrangler itself is pinned in package.json and installed
# from package-lock.json, so no third-party deploy action is needed.

env:
  # No usage telemetry from CI.
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: test + bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      # Bundles the Worker exactly as a deploy would, without uploading it.
      - run: npm run check

  deploy:
    name: deploy (example.jamhooks.com)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # The Cloudflare secrets live in this environment, which only `master` may use,
    # so a workflow changed on another branch can't read them.
    environment:
      name: production
      url: https://example.jamhooks.com/health
    # One deploy at a time; a newer push waits for the running one to finish.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the deployed API answers
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 https://example.jamhooks.com/health
          curl -fsS https://example.jamhooks.com/accounts/100001 | grep -q '"status":"active"'
