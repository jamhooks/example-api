# Weekly, grouped update PRs for everything this repo pins: the CI actions (by
# commit SHA) and wrangler (package.json + package-lock.json). `cooldown` holds a
# fresh release back a few days; security updates are not delayed.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      npm:
        patterns: ["*"]
